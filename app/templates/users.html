{% extends "base.html" %} {% block title %}用户管理 - Xictation{% endblock %} {%
block content %}
<div class="users-page">
  <div class="page-header">
    <h2 class="page-title">用户管理</h2>
    <button id="btnAddUser" class="btn-primary">+ 新建用户</button>
  </div>

  <div class="table-container">
    <table class="data-table" id="usersTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>用户名</th>
          <th>账号</th>
          <th>角色</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr>
          <td colspan="6" class="text-center">加载中...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 用户编辑弹窗 -->
<div id="userModal" class="modal-overlay" style="display: none">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="userModalTitle">新建用户</h3>
      <button class="modal-close" onclick="closeUserModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="userForm">
        <input type="hidden" id="editUserId" />
        <div class="form-group">
          <label>用户名 <span class="required">*</span></label>
          <input
            type="text"
            id="userDisplayName"
            required
            placeholder="显示名称"
          />
        </div>
        <div class="form-group">
          <label>账号 <span class="required">*</span></label>
          <input
            type="text"
            id="userUsername"
            required
            placeholder="登录账号"
          />
        </div>
        <div class="form-group">
          <label>密码 <span id="pwdRequired" class="required">*</span></label>
          <input
            type="password"
            id="userPassword"
            autocomplete="off"
            placeholder="密码"
          />
          <small
            id="pwdHint"
            style="display: none; color: var(--color-text-secondary)"
            >留空则不修改密码</small
          >
        </div>
        <div class="form-group">
          <label
            >确认密码
            <span id="confirmRequired" class="required">*</span></label
          >
          <input
            type="password"
            id="userConfirmPassword"
            autocomplete="off"
            placeholder="再次输入密码"
          />
        </div>
        <div class="form-group">
          <label>角色</label>
          <select id="userRole">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button id="btnDeleteUser" class="btn-danger" style="display: none">
        删除
      </button>
      <button class="btn-outline" onclick="closeUserModal()">取消</button>
      <button id="btnSaveUser" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- 确认删除弹窗 -->
<div id="confirmModal" class="modal-overlay" style="display: none">
  <div class="modal-card modal-sm">
    <div class="modal-header">
      <h3>确认删除</h3>
      <button class="modal-close" onclick="closeConfirmModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p>确定要删除此用户吗？此操作不可撤销。</p>
    </div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeConfirmModal()">取消</button>
      <button id="btnConfirmDelete" class="btn-danger">确认删除</button>
    </div>
  </div>
</div>

<script>
  let usersData = [];
  let deleteTargetId = null;

  async function loadUsers() {
    try {
      const res = await fetch("/api/users");
      usersData = await res.json();
      renderUsers();
    } catch (err) {
      document.getElementById("usersTableBody").innerHTML =
        '<tr><td colspan="6" class="text-center">加载失败</td></tr>';
    }
  }

  function renderUsers() {
    const tbody = document.getElementById("usersTableBody");
    if (!usersData.length) {
      tbody.innerHTML =
        '<tr><td colspan="6" class="text-center">暂无用户</td></tr>';
      return;
    }
    tbody.innerHTML = usersData
      .map(
        (u) => `
      <tr>
        <td>${u.id}</td>
        <td>${u.display_name}</td>
        <td>${u.username}</td>
        <td>${u.role === "admin" ? "管理员" : "普通用户"}</td>
        <td>${u.created_at || "-"}</td>
        <td><button class="btn-text" onclick="editUser(${u.id})">编辑</button></td>
      </tr>
    `,
      )
      .join("");
  }

  function openUserModal(isEdit = false) {
    document.getElementById("userModalTitle").textContent = isEdit
      ? "编辑用户"
      : "新建用户";
    document.getElementById("btnDeleteUser").style.display = isEdit
      ? ""
      : "none";
    document.getElementById("pwdHint").style.display = isEdit ? "" : "none";
    document.getElementById("pwdRequired").style.display = isEdit ? "none" : "";
    document.getElementById("confirmRequired").style.display = isEdit
      ? "none"
      : "";
    document.getElementById("userModal").style.display = "flex";
  }

  function closeUserModal() {
    document.getElementById("userModal").style.display = "none";
    document.getElementById("userForm").reset();
    document.getElementById("editUserId").value = "";
  }

  function editUser(id) {
    const u = usersData.find((x) => x.id === id);
    if (!u) return;
    document.getElementById("editUserId").value = u.id;
    document.getElementById("userDisplayName").value = u.display_name;
    document.getElementById("userUsername").value = u.username;
    document.getElementById("userRole").value = u.role;
    document.getElementById("userPassword").value = "";
    document.getElementById("userConfirmPassword").value = "";
    openUserModal(true);
  }

  function closeConfirmModal() {
    document.getElementById("confirmModal").style.display = "none";
    deleteTargetId = null;
  }

  document.getElementById("btnAddUser").onclick = () => {
    document.getElementById("userForm").reset();
    document.getElementById("editUserId").value = "";
    openUserModal(false);
  };

  document.getElementById("btnSaveUser").onclick = async () => {
    const id = document.getElementById("editUserId").value;
    const payload = {
      display_name: document.getElementById("userDisplayName").value.trim(),
      username: document.getElementById("userUsername").value.trim(),
      password: document.getElementById("userPassword").value,
      confirm_password: document.getElementById("userConfirmPassword").value,
      role: document.getElementById("userRole").value,
    };

    if (!payload.display_name || !payload.username) {
      showToast("用户名和账号不能为空");
      return;
    }
    if (!id && !payload.password) {
      showToast("密码不能为空");
      return;
    }
    if (payload.password && payload.password !== payload.confirm_password) {
      showToast("两次输入的密码不一致");
      return;
    }

    try {
      const url = id ? `/api/users/${id}` : "/api/users";
      const method = id ? "PUT" : "POST";
      // 编辑时密码留空则不传
      if (id && !payload.password) {
        delete payload.password;
        delete payload.confirm_password;
      }
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.error || "保存失败");
        return;
      }
      showToast("保存成功");
      closeUserModal();
      loadUsers();
    } catch (err) {
      showToast("网络错误");
    }
  };

  document.getElementById("btnDeleteUser").onclick = () => {
    deleteTargetId = document.getElementById("editUserId").value;
    document.getElementById("confirmModal").style.display = "flex";
  };

  document.getElementById("btnConfirmDelete").onclick = async () => {
    if (!deleteTargetId) return;
    try {
      const res = await fetch(`/api/users/${deleteTargetId}`, {
        method: "DELETE",
      });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.error || "删除失败");
        return;
      }
      showToast("已删除");
      closeConfirmModal();
      closeUserModal();
      loadUsers();
    } catch (err) {
      showToast("网络错误");
    }
  };

  loadUsers();
</script>
{% endblock %}
